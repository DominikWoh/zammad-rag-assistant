version: '3.8'

services:
  zammad-rag-assistant:
    image: duftertyp/zammad-rag-assistant:latest
    container_name: zammad-rag-assistant
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8083:8083"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./cache:/app/cache
      - ./models:/app/models
      - ./bm25_stats.json:/app/bm25_stats.json
      - huggingface_cache:/root/.cache/huggingface
      - torch_cache:/root/.cache/torch
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  huggingface_cache:
  torch_cache:
